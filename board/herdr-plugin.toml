id = "hardness.board"
name = "Luna TUI"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Luna TUI board for herdr: Backlog, Intake, Triage, Approved, Build, Verify, Evidence, Ship, Done"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "board"
title = "Luna TUI"
command = ["target/release/hardness-board"]
placement = "tab"

[[actions]]
id = "open"
title = "Open Luna TUI"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin hardness.board --entrypoint board"]
