# `docker compose up` (or `pnpm start`) runs Postgres and the machine: local "prod", nothing
# to keep running on the side. `pnpm dev` starts only Postgres (`docker compose up postgres`)
# and runs the machine on the host with hot reload, for working on the harness itself.
# `docker compose --profile observe up -d` adds Laminar, the local trace and eval UI (docs/configuration.md).
name: hardness-dev

services:
  postgres:
    image: postgres:16
    environment:
      # Local credentials. The port is bound to localhost only.
      POSTGRES_USER: hardness
      POSTGRES_PASSWORD: hardness
      POSTGRES_DB: hardness
    ports:
      # 5433 on the host, so it never clashes with a Postgres you run yourself.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardness -d hardness"]
      interval: 2s
      timeout: 3s
      retries: 20

  machine:
    build:
      context: .
      dockerfile: machine/Dockerfile
    image: hardness-machine:local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Bound to 0.0.0.0 in here, the API asks for its token (`pnpm start` writes one), /health too.
      test: ["CMD", "node", "-e", "const t = process.env.MACHINE_API_TOKEN || require('fs').readFileSync('/root/.config/hardness/machine-api-token', 'utf8'); fetch('http://127.0.0.1:4317/health', { headers: { authorization: 'Bearer ' + t.replace(/\\s+/g, '') } }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      # 4318 on the host, so the board can tell this machine from a `pnpm dev` one on 4317.
      - "127.0.0.1:${MACHINE_DOCKER_PORT:-4318}:4317"
    environment:
      DATABASE_URL: postgres://hardness:hardness@postgres:5432/hardness
      MACHINE_HOST: 0.0.0.0
      # Required beyond loopback: from the shell, else ~/.config/hardness/machine-api-token (mounted below).
      MACHINE_API_TOKEN: ${MACHINE_API_TOKEN:-}
      MACHINE_PORT: "4317"
      # Stage containers are started through the host's Docker, which resolves mounts on the
      # host. So every path the machine hands to `docker run` must be the same path in here:
      # repos and worktrees under LUNA_REPOS_DIR, run folders under the state dir.
      WORKTREES_DIR: ${WORKTREES_DIR:-${HOME}/Developer/worktrees}
      # Where the machine looks for a PR's checkout. Inside the container HOME is /root, so the
      # default would be an empty /root/Developer: name the mounted folder, at its host path.
      MACHINE_REPOS_DIR: ${LUNA_REPOS_DIR:-${HOME}/Developer}
      MACHINE_REPO_MAP: ${MACHINE_REPO_MAP:-}
      MACHINE_STATE_DIR: ${MACHINE_STATE_DIR:-${HOME}/.local/state/hardness}
      MACHINE_AGENTS: ${MACHINE_AGENTS:-on}
      MACHINE_MAX_CONCURRENT: ${MACHINE_MAX_CONCURRENT:-4}
      MACHINE_MAX_PER_REPO: ${MACHINE_MAX_PER_REPO:-}
      MACHINE_RESTART_POLICY: ${MACHINE_RESTART_POLICY:-requeue}
      MACHINE_WORKTREE_RETENTION_DAYS: ${MACHINE_WORKTREE_RETENTION_DAYS:-7}
      MACHINE_TASK_BUDGET_USD: ${MACHINE_TASK_BUDGET_USD:-}
      MACHINE_DAILY_BUDGET_USD: ${MACHINE_DAILY_BUDGET_USD:-}
      MACHINE_GITHUB_POLL: ${MACHINE_GITHUB_POLL:-}
      MACHINE_GITHUB_LABEL: ${MACHINE_GITHUB_LABEL:-ready-for-agent}
      # The Slack inbox (board `S`): your own app's user token, and its app-level token for the
      # live socket. Both come from a root .env or the shell; see docs/install.md "Slack inbox".
      MACHINE_SLACK_USER_TOKEN: ${MACHINE_SLACK_USER_TOKEN:-}
      MACHINE_SLACK_APP_TOKEN: ${MACHINE_SLACK_APP_TOKEN:-}
      MACHINE_SLACK_INBOX: ${MACHINE_SLACK_INBOX:-on}
      MACHINE_SLACK_MARK_READ: ${MACHINE_SLACK_MARK_READ:-off}
      MACHINE_SLACK_DIGEST_AT: ${MACHINE_SLACK_DIGEST_AT:-}
      # The triage rules you edit; the machine's own default, spelled out so a host MACHINE_STATE_DIR carries over.
      MACHINE_SLACK_RULES: ${MACHINE_SLACK_RULES:-${MACHINE_STATE_DIR:-${HOME}/.local/state/hardness}/slack-triage.md}
      # Jira (docs/install.md "Jira"): the site, your email and API token, from a root .env or the shell.
      MACHINE_JIRA_SITE: ${MACHINE_JIRA_SITE:-}
      MACHINE_JIRA_EMAIL: ${MACHINE_JIRA_EMAIL:-}
      MACHINE_JIRA_TOKEN: ${MACHINE_JIRA_TOKEN:-}
      MACHINE_JIRA_TOKEN_EXPIRES: ${MACHINE_JIRA_TOKEN_EXPIRES:-}
      MACHINE_JIRA_CLOUD_ID: ${MACHINE_JIRA_CLOUD_ID:-}
      MACHINE_JIRA: ${MACHINE_JIRA:-on}
      # The kill switch and the per-engine monthly caps (docs/configuration.md).
      MACHINE_DISABLE_RUNTIMES: ${MACHINE_DISABLE_RUNTIMES:-}
      MACHINE_ENGINE_BUDGETS: ${MACHINE_ENGINE_BUDGETS:-}
      # Run traces to the local Laminar (`docker compose --profile observe up -d`; docs/configuration.md "Observability").
      # The key is also read from ~/.config/hardness/lmnr-project-api-key (mounted below).
      LMNR_PROJECT_API_KEY: ${LMNR_PROJECT_API_KEY:-}
      LMNR_BASE_URL: ${LMNR_BASE_URL:-http://lmnr-app}
      # Stage containers are siblings started through the host's Docker: they reach Laminar through the host's published ports.
      LMNR_STAGE_BASE_URL: ${LMNR_STAGE_BASE_URL:-http://host.docker.internal}
      LMNR_HTTP_PORT: ${LMNR_HTTP_PORT:-8000}
      LMNR_GRPC_PORT: ${LMNR_GRPC_PORT:-8001}
      MACHINE_TRACES: ${MACHINE_TRACES:-}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-hardness-runner:dev}
      RUNNER_QA_IMAGE: ${RUNNER_QA_IMAGE:-hardness-runner-qa:dev}
      RUNNER_VIDEO_IMAGE: ${RUNNER_VIDEO_IMAGE:-hardness-runner-video:dev}
      # gh and git push to GitHub over https with this token (`pnpm start` passes `gh auth token`).
      GH_TOKEN: ${GH_TOKEN:-}
      # The Codex (ChatGPT) login for `codex:*` engines: your Codex home, mounted below. The machine
      # copies auth.json into each run's folder and writes a refreshed token back here, so the stage
      # containers never see this folder.
      CODEX_HOME: /root/.codex-host
      # Repos are owned by your user, not the container's; gh answers git's https auth;
      # commits made here (the approved memory rules) carry your identity (`pnpm start` reads
      # it); and ssh GitHub remotes go over https, since there is no ssh key in here.
      GIT_CONFIG_COUNT: "6"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GIT_CONFIG_KEY_1: credential.https://github.com.helper
      GIT_CONFIG_VALUE_1: "!gh auth git-credential"
      GIT_CONFIG_KEY_2: user.name
      GIT_CONFIG_VALUE_2: ${LUNA_GIT_NAME:-}
      GIT_CONFIG_KEY_3: user.email
      GIT_CONFIG_VALUE_3: ${LUNA_GIT_EMAIL:-}
      GIT_CONFIG_KEY_4: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_4: "git@github.com:"
      GIT_CONFIG_KEY_5: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_5: "ssh://git@github.com/"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LUNA_REPOS_DIR:-${HOME}/Developer}:${LUNA_REPOS_DIR:-${HOME}/Developer}
      - ${MACHINE_STATE_DIR:-${HOME}/.local/state/hardness}:${MACHINE_STATE_DIR:-${HOME}/.local/state/hardness}
      - ${HOME}/.config/hardness:/root/.config/hardness:ro
      # Read-write: a run that refreshed the Codex token writes it back (a temp file, then a rename).
      - ${CODEX_HOME:-${HOME}/.codex}:/root/.codex-host

  # Laminar (laminar.sh, Apache 2.0): traces of every stage and pack run, and the replay evals'
  # scorecards, in a UI at http://localhost:5667. Opt-in: `docker compose --profile observe up -d`,
  # create a project in the UI, put its API key in ~/.config/hardness/lmnr-project-api-key and
  # restart the machine. The lightweight upstream stack, without a queue: for one machine on one
  # computer. Its stores are its own (never the machine's Postgres). Everything binds to localhost;
  # the secrets below are local defaults you may override from .env. No LLM key: Laminar's AI
  # features stay off, the eval_judge pack judges.
  lmnr-postgres:
    image: postgres:16
    profiles: ["observe"]
    environment:
      POSTGRES_USER: ${LMNR_POSTGRES_USER:-lmnr}
      POSTGRES_PASSWORD: ${LMNR_POSTGRES_PASSWORD:-lmnr}
      POSTGRES_DB: ${LMNR_POSTGRES_DB:-lmnr}
    volumes:
      - lmnr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMNR_POSTGRES_USER:-lmnr} -d ${LMNR_POSTGRES_DB:-lmnr}"]
      interval: 2s
      timeout: 5s
      retries: 20

  lmnr-clickhouse:
    image: clickhouse/clickhouse-server:26.5
    profiles: ["observe"]
    environment:
      CLICKHOUSE_USER: ${LMNR_CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${LMNR_CLICKHOUSE_PASSWORD:-lmnr}
    volumes:
      - lmnr-clickhouse-data:/var/lib/clickhouse/
      - lmnr-clickhouse-logs:/var/log/clickhouse-server/
      - ./observe/clickhouse-profiles.xml:/etc/clickhouse-server/users.d/lmnr.xml:ro
      - ./observe/clickhouse-server.xml:/etc/clickhouse-server/config.d/lmnr.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  lmnr-quickwit:
    image: quickwit/quickwit:v0.9.1
    profiles: ["observe"]
    environment:
      QW_DATA_DIR: /quickwit/qwdata
    command: ["run"]
    volumes:
      - lmnr-quickwit-data:/quickwit/qwdata
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7280 && printf 'GET /health/livez HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6

  lmnr-app:
    image: ghcr.io/lmnr-ai/app-server
    profiles: ["observe"]
    depends_on:
      lmnr-postgres:
        condition: service_healthy
      lmnr-clickhouse:
        condition: service_started
      lmnr-quickwit:
        condition: service_healthy
    ports:
      # The SDK's HTTP and gRPC ports, for `pnpm dev` and `pnpm eval` on the host; the compose machine reaches lmnr-app by name.
      - "127.0.0.1:${LMNR_HTTP_PORT:-8000}:8000"
      - "127.0.0.1:${LMNR_GRPC_PORT:-8001}:8001"
    environment:
      PORT: 8000
      GRPC_PORT: 8001
      ENVIRONMENT: LITE
      DATABASE_URL: postgres://${LMNR_POSTGRES_USER:-lmnr}:${LMNR_POSTGRES_PASSWORD:-lmnr}@lmnr-postgres:5432/${LMNR_POSTGRES_DB:-lmnr}
      SHARED_SECRET_TOKEN: ${LMNR_SHARED_SECRET_TOKEN:-local-shared-secret}
      CLICKHOUSE_URL: http://lmnr-clickhouse:8123
      CLICKHOUSE_USER: ${LMNR_CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${LMNR_CLICKHOUSE_PASSWORD:-lmnr}
      CLICKHOUSE_RO_USER: ${LMNR_CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_RO_PASSWORD: ${LMNR_CLICKHOUSE_PASSWORD:-lmnr}
      # Exactly 32 bytes as 64 hex characters; a local default, override from .env for anything shared.
      AEAD_SECRET_KEY: ${LMNR_AEAD_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      QUICKWIT_SEARCH_URL: http://lmnr-quickwit:7280
      QUICKWIT_INGEST_URL: http://lmnr-quickwit:7281
      QUICKWIT_SPANS_INDEX_ID: spans_v2

  lmnr-frontend:
    image: ghcr.io/lmnr-ai/frontend
    profiles: ["observe"]
    depends_on:
      lmnr-postgres:
        condition: service_healthy
      lmnr-clickhouse:
        condition: service_started
      lmnr-quickwit:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LMNR_FRONTEND_PORT:-5667}:5667"
    environment:
      PORT: 5667
      ENVIRONMENT: LITE
      DATABASE_URL: postgres://${LMNR_POSTGRES_USER:-lmnr}:${LMNR_POSTGRES_PASSWORD:-lmnr}@lmnr-postgres:5432/${LMNR_POSTGRES_DB:-lmnr}
      BACKEND_URL: http://lmnr-app:8000
      BACKEND_RT_URL: http://lmnr-app:8002
      SHARED_SECRET_TOKEN: ${LMNR_SHARED_SECRET_TOKEN:-local-shared-secret}
      NEXTAUTH_URL: http://localhost:${LMNR_FRONTEND_PORT:-5667}
      NEXTAUTH_SECRET: ${LMNR_NEXTAUTH_SECRET:-local-nextauth-secret}
      NEXT_PUBLIC_URL: http://localhost:${LMNR_FRONTEND_PORT:-5667}
      LAMINAR_TELEMETRY_DISABLED: "true"
      CLICKHOUSE_URL: http://lmnr-clickhouse:8123
      CLICKHOUSE_USER: ${LMNR_CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_PASSWORD: ${LMNR_CLICKHOUSE_PASSWORD:-lmnr}
      CLICKHOUSE_RO_USER: ${LMNR_CLICKHOUSE_USER:-lmnr}
      CLICKHOUSE_RO_PASSWORD: ${LMNR_CLICKHOUSE_PASSWORD:-lmnr}
      CLICKHOUSE_POSTGRES_HOST: lmnr-postgres
      CLICKHOUSE_POSTGRES_PORT: "5432"
      CLICKHOUSE_POSTGRES_DATABASE: ${LMNR_POSTGRES_DB:-lmnr}
      CLICKHOUSE_POSTGRES_SCHEMA: public
      AEAD_SECRET_KEY: ${LMNR_AEAD_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      QUICKWIT_SEARCH_URL: http://lmnr-quickwit:7280

volumes:
  pgdata:
  lmnr-pgdata:
  lmnr-clickhouse-data:
  lmnr-clickhouse-logs:
  lmnr-quickwit-data:
