name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  machine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://hardness:hardness@127.0.0.1:5433/hardness_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hardness
          POSTGRES_PASSWORD: hardness
          POSTGRES_DB: hardness
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hardness -d hardness"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Go and Rust are the runner image's versions (machine/runner/Dockerfile): bump them together (a test checks).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.1"
          cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Git identity for the worktree tests
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: Unit tests
        run: pnpm --filter @hardness/machine test
      - name: Typecheck
        run: pnpm --filter @hardness/machine typecheck
      # make setup's scripts: shellcheck, and the .env and credential writes on temp files.
      - name: Setup scripts
        run: shellcheck -x -P SCRIPTDIR scripts/setup/*.sh scripts/setup/helpers/*.sh && bash scripts/setup/lib.test.sh
      # Every golden fixture ticket must be red with its seed and green with its reference
      # patch; a fixture that drifts would grade real agent runs against a broken bar.
      - name: Golden fixtures self-validate
        run: node machine/scripts/golden-task.mjs --selftest

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Includes the factory conformance test: every answer a pack may give must ingest.
      - name: Unit tests
        run: pnpm --filter @hardness/contracts test
      - name: Typecheck
        run: pnpm --filter @hardness/contracts typecheck

  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @hardness/factory test
      - name: Typecheck
        run: pnpm --filter @hardness/factory typecheck

  # The replay evals' grading only: a live eval needs a model credential, so it never runs here.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @hardness/evals test
      - name: Typecheck
        run: pnpm --filter @hardness/evals typecheck

  # A fresh clone, nothing else installed: the stage image builds from this checkout alone
  # and a dry-run stage goes through the hardened sandbox without a model call.
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the runner image
        run: bash machine/runner/build.sh
      - name: Sandbox smoke (no model call)
        run: pnpm --filter @hardness/machine smoke:sandbox

  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: board
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: board
      # rustfmt is not enforced yet: the crate predates it (133 hunks of drift); a format-only
      # PR adds `cargo fmt --check` here. large_enum_variant is allowed until the three
      # enums it names are boxed.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::large_enum_variant
      - name: Tests
        run: cargo test

  herdr-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The mod has no dependencies: its model, stream parser and drawing run under node --test,
      # Herdr's host modules replaced by herdr-app/test/host.
      - name: Tests
        run: node --import ./herdr-app/test/host/register.js --test herdr-app/test/*.test.js

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Facts match the repo
        run: pnpm --filter site facts:check
      - name: Unit tests
        run: pnpm --filter site test
      - name: Lint
        run: pnpm --filter site lint
      - name: Typecheck
        run: pnpm --filter site typecheck
      - name: Build
        run: pnpm --filter site build
